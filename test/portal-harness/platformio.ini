[platformio]
default_envs = esp8266

[common]
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    WiFiManager=symlink://../..
build_flags =
extra_scripts =
    pre:tools/ota_fixture_input.py

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    -DWM_LOG_LEVEL=4

[env:esp32]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -DWM_LOG_LEVEL=4

; The OTA test harness writes its A/B marker into an ignored header included
; only by the portal fixture. One environment per platform keeps the explicit
; update layout while allowing the A-to-B rebuild to reuse every library object.
[env:esp8266_ota]
extends = env:esp8266
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    ${env:esp8266.build_flags}
    ${common.build_flags}
    -DWM_PORTAL_OTA_TEST=1

[env:esp32_ota]
extends = env:esp32
board_build.partitions = partitions/esp32_ota_4m_no_fs.csv
build_flags =
    ${env:esp32.build_flags}
    ${common.build_flags}
    -DWM_PORTAL_OTA_TEST=1
