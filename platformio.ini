; PlatformIO Project Configuration File for WiFiManager Library
; This file is used for building tests

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
; Postmortem jump relocation fix for large binaries (see ESP8266-LINKER-WORKAROUND.md in arduino-home-assistant)
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
monitor_speed = 115200
test_framework = unity
test_build_src = no
build_flags =
    -DWM_LOG_LEVEL=5
    -DUNIT_TEST
lib_deps = 
    ESP32Async/ESPAsyncWebServer@3.9.1
    DeviceFrameworkTemplateEngine=https://github.com/alexhopeoconnor/DFTE.git#v1.2.0
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
test_build_src = no
build_unflags = 
    -std=gnu++11
build_flags = 
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -DWM_LOG_LEVEL=5
    -DUNIT_TEST
lib_deps = 
    ESP32Async/ESPAsyncWebServer@3.9.1
    DeviceFrameworkTemplateEngine=https://github.com/alexhopeoconnor/DFTE.git#v1.2.0
    ESP32Async/AsyncTCP@^3.4.9

; Optional: compile tests with DFTE logs bridged into WiFiManager::log (see README)
[env:esp8266_dfte_log]
extends = env:esp8266
build_flags =
    ${env:esp8266.build_flags}
    -DWM_DFTE_LOGGING

