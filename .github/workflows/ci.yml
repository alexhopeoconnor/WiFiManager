name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ["esp8266", "esp32"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio==6.1.19
      - run: ./scripts/compile-check.sh --platform ${{ matrix.environment }}
